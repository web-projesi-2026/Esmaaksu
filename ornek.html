<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RafArası - Örnek Dinamik Veri Sayfası</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <style>
    body { background-color: #f8f9fa; }
    .card:hover { transform: translateY(-5px); transition: all 0.3s ease; box-shadow: 0 10px 20px rgba(0,0,0,0.1) !important; }
  </style>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body>
  
  <!-- Navbar (Basit Örnek) -->
  <nav class="navbar navbar-dark bg-dark mb-5">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-book-half me-2"></i>RafArası Ana Sayfaya Dön
      </a>
      <span class="navbar-text text-light">
        Ödev / Proje Teslimi Örnek Sayfası
      </span>
    </div>
  </nav>

  <!-- İçerik Alanı -->
  <div class="container mt-5 mb-5">
    <h2 class="mb-2 fw-bold text-dark">Öne Çıkan Kitaplar</h2>
    <p class="text-muted mb-4">Bu sayfadaki veriler <code>fetch()</code> API kullanılarak <code>kitaplar.json</code> dosyasından asenkron olarak çekilmektedir.</p>
    
    <!-- Kartların JavaScript ile dinamik ekleneceği div -->
    <div class="row g-4" id="kitaplar-konteyner">
      <!-- Yükleniyor mesajı -->
      <div class="col-12 text-center" id="loading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Yükleniyor...</span>
        </div>
        <p class="mt-2 text-muted">Kitap verileri yükleniyor...</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/ornek.js"></script>
</body>
</html>
